name: Android

# Builds and tests the native app in android/. Releases are cut by pushing a tag
# `android-v<version>` that points at a commit on main.
# NOTE: third-party actions are referenced by major version tag. Pin them to commit
# SHAs (e.g. with Dependabot or `pinact`) once the SHAs have been verified.

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["android-v*"]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The default 'tools' package no longer exists in sdkmanager; Gradle installs what the build needs.
          packages: ''
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test, lint and assemble
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Check Room schema export
        working-directory: .
        run: |
          # Existing schema files must never change silently: a change needs a version bump, a Migration and a test.
          if git status --porcelain -- android/app/schemas | grep -v '^??' | grep -q .; then
            echo "::error::Room schema files changed. Commit them together with a Migration and a migration test."
            git status --porcelain -- android/app/schemas
            exit 1
          fi
          if git status --porcelain -- android/app/schemas | grep -q '^??'; then
            echo "::warning::New Room schema files were generated but are not committed (android/app/schemas)."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            android/core/build/reports
            android/app/build/reports
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tags must be created on main."
            exit 1
          }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The default 'tools' package no longer exists in sdkmanager; Gradle installs what the build needs.
          packages: ''
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          ./gradlew --no-daemon :app:assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
      - name: Verify signature and name the asset
        run: |
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify "$APK"
          VERSION="${GITHUB_REF_NAME#android-v}"
          cp "$APK" "gymapp-$VERSION.apk"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          gh release create "$GITHUB_REF_NAME" "gymapp-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "GymApp Android $VERSION" \
            --notes "Android app $VERSION. Install over the existing app; the signature must match."
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
