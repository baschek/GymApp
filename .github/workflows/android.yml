name: Android

# Builds and tests the native app in android/. Releases are cut by pushing a tag
# `android-v<version>` that points at a commit on main, or by running this workflow
# manually on main with `release_version` (e.g. 2.3.0): then the release job creates
# the tag `android-v<version>` on that commit together with the release.
# NOTE: third-party actions are referenced by major version tag. Pin them to commit
# SHAs (e.g. with Dependabot or `pinact`) once the SHAs have been verified.

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["android-v*"]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release this commit of main as android-v<version> (e.g. 2.3.0); empty = build only"
        required: false
        default: ""

permissions: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default 'tools' package no longer exists in sdkmanager; Gradle installs what the build needs.
          packages: ''
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test, lint and assemble
        env:
          # Robolectric fetches its Android runtimes separately from Gradle's Maven Central resolver.
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :wear-backend:testDebugUnitTest :wear-backend:lintDebug :wear-backend:assembleDebug :watch:testDebugUnitTest :watch:lintDebug :watch:assembleDebug
      - name: Check Room schema export
        working-directory: .
        run: |
          # Existing schema files must never change silently: a change needs a version bump, a Migration and a test.
          if git status --porcelain -- android/app/schemas | grep -v '^??' | grep -q .; then
            echo "::error::Room schema files changed. Commit them together with a Migration and a migration test."
            git status --porcelain -- android/app/schemas
            exit 1
          fi
          if git status --porcelain -- android/app/schemas | grep -q '^??'; then
            echo "::warning::New Room schema files were generated but are not committed (android/app/schemas)."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            android/core/build/reports
            android/app/build/reports
            android/wear-backend/build/reports
            android/wear-backend/build/outputs/aar
            android/watch/build/reports
            android/watch/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/android-v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
              echo "::error::release_version must look like 2.3.0"; exit 1; }
            TAG="android-v$INPUT_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists."; exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG#android-v}" >> "$GITHUB_ENV"
      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tags must be created on main."
            exit 1
          }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default 'tools' package no longer exists in sdkmanager; Gradle installs what the build needs.
          packages: ''
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="$RELEASE_VERSION"
          ./gradlew --no-daemon :app:assembleRelease :watch:assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
      - name: Verify signature and name the asset
        run: |
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify "$APK"
          VERSION="$RELEASE_VERSION"
          cp "$APK" "gymapp-$VERSION.apk"
          WATCH_APK="$(ls android/watch/build/outputs/apk/release/*.apk | head -n 1)"
          "$APKSIGNER" verify "$WATCH_APK"
          cp "$WATCH_APK" "gymapp-watch-$VERSION.apk"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$RELEASE_VERSION"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_FLAG=(--target "$GITHUB_SHA")
          else
            TAG_FLAG=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" "gymapp-$VERSION.apk" "gymapp-watch-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" "${TAG_FLAG[@]}" \
            --title "GymApp Android $VERSION" \
            --notes "Android app $VERSION. Install over the existing app; the signature must match."
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
